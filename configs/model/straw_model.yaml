_target_: src.tracknet.training.StrawTrackNETModule

input_features: 5
hidden_features: 1024
num_tubes: auto
learning_rate: 0.0001
batch_first: true
use_plane_embedding: true
plane_embedding_dim: 8
# Normalize [x0, y0, z0, dr] to approximately [-1, 1].
continuous_feature_center: [0.0, 0.0, 120.0, 2.5]
continuous_feature_scale: [750.0, 750.0, 120.0, 2.5]
# The first prediction included in loss is tube 3 after two seed tubes.
seed_hits: 2
#hits_normalizer: ${transforms.normalizer}
